<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result - CIMAGE GROUP OF INSTITUTIONS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="CIMAGE GROUP OF INSTITUTIONS Logo" id="logo-image">
            </div>
            <h1>CIMAGE GROUP OF INSTITUTIONS Exam Result</h1>
        </header>
        
        <main class="result-container">
            <div class="card">
                <h2>Exam Results</h2>
                <div class="result-summary">
                    <p>Total Questions: <span id="total-questions">0</span></p>
                    <p>Correct Answers: <span id="correct-answers">0</span></p>
                    <p>Score: <span id="score">0</span>%</p>
                </div>
                
                <div id="question-results">
                    <!-- Question results will be displayed here -->
                </div>
                
                <button id="back-to-login" class="btn primary">Back to Login</button>
            </div>
        </main>
    </div>
    
    <script src="js/result.js"></script>
</body>
</html>
